# ============================================================
# alquileres-app-v2 - configuracion del backend
# ============================================================

server.port=8080

# --- Conexion Google Sheets (Apps Script Web App) ------------
# Modo de almacenamiento: auto | google | local
#   google : usa el Apps Script Web App (requiere app.sheets.deploy-id)
#   local  : base de datos local en backend/data/db.json (sin Google)
#   auto   : google si hay deploy-id, si no local
app.sheets.mode=auto

# ID de implementacion del Apps Script Web App (se obtiene al publicar el script:
# Implementacion > Nueva implementacion > Aplicacion web). Dejar vacio para modo local.
app.sheets.deploy-id=AKfycbydPCNZANWfXjBkBLtabdlY5F_cPG_eRW8Pa95EI2nnwisE_9BFJng7PcSAZlyEEmVl_g

# Nombre del spreadsheet en Google Drive (solo informativo / verificado por el script).
app.sheets.nombre=Casa

# Intervalo de sincronizacion con Google Sheets en milisegundos (default 30s).
# El frontend consulta al backend cada 5s, por lo que los cambios en la hoja
# aparecen en tiempo casi real sin desbordar la cuota del script.
app.sheets.sync-ms=30000

# Tiempo de espera en ms de las llamadas http al script de Google.
app.sheets.http-timeout-ms=60000

# Localizacion del archivo local (solo modo local).
app.sheets.local-file=./data/db.json

logging.level.com.alquileres.app=INFO